services:
  - type: web
    name: instagram-auth
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: INSTAGRAM_USERNAME
        sync: false
      - key: INSTAGRAM_PASSWORD
        sync: false
      - key: INSTAGRAM_SESSION_FILE
        value: /var/data/instagram.json
      - key: LOG_LEVEL
        value: INFO
